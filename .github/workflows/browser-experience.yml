name: Browser Experience QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install test runner only
        run: npm install --no-save --no-package-lock @playwright/test@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check key journeys and accessibility
        run: npx playwright test --config=playwright.config.cjs
