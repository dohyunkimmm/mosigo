name: Browser Experience QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install test runner only
        run: npm install --no-save --no-package-lock @playwright/test@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check key journeys and accessibility
        run: npx playwright test --config=playwright.config.cjs
