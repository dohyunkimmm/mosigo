name: Browser Experience QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-journey:
    runs-on: ubuntu-latest
    # Playwright's matching image includes browsers and system dependencies;
    # avoid apt package downloads from flaky runner Ubuntu mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install test runner only
        run: npm install --no-save --no-package-lock @playwright/test@1.56.0
      - name: Check preinstalled browser runtime
        run: |
          test -d /ms-playwright
          npx playwright --version
      - name: Check key journeys and accessibility
        run: npx playwright test --config=tests/config/playwright.config.cjs
      - name: Check mobile media on Android Chromium and iPhone WebKit
        run: npx playwright test --config=tests/config/playwright.mobile.config.cjs
