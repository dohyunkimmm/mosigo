name: v3 Split Index Assets

on:
  push:
    branches:
      - v3/split-index-assets
    paths:
      - scripts/split-index-assets.js
      - .github/workflows/v3-split-index.yml

permissions:
  contents: write

jobs:
  split-index-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v3/split-index-assets

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Split index assets
        run: node scripts/split-index-assets.js

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/index.css src/index-core.js src/index-post.js
          git commit -m "refactor(v3): split index CSS and JavaScript assets"
          git push origin HEAD:v3/split-index-assets
