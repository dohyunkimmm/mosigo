name: Node deprecation trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-deprecations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Trace deprecations during tests
        env:
          NODE_OPTIONS: --trace-deprecation
        run: npm test
