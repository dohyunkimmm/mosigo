name: One-off PNG to WebP candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  convert-verified-images:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/optimize-hero-png-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify image encoder is available
        run: |
          command -v ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libwebp'
      - name: Encode both assets, validate size and similarity, update references
        run: bash scripts/optimize-images.sh
      - name: Validate optimized site and source contracts
        run: npm run quality
      - name: Remove this one-off workflow and commit optimized binaries to the PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'chore/optimize-hero-png-20261027'
          test -f src/gyeote_report_hero.webp
          test -f src/day.webp
          git rm .github/workflows/optimize-png-pr.yml
          git add -A src/gyeote_report_hero.png src/gyeote_report_hero.webp src/day.png src/day.webp src/index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(media): replace two large PNGs with validated WebP assets'
          git push origin "HEAD:$HEAD_REF"
