name: Production Smoke

on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed

permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for matching Vercel Production and smoke-test it
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SMOKE_ATTEMPTS: '18'
          SMOKE_RETRY_MS: '10000'
        run: npm run smoke:production
