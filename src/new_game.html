<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모시고 | 황금낚시</title>
<meta name="description" content="낚시 애니메이션으로 리워드 결과를 확인하는 모시고 이벤트 데모입니다.">
<meta name="theme-color" content="#C8EB8F">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="new_montage.css">
<link rel="stylesheet" href="new_game.css">
</head>
<body>

<img class="status-img" src="bar.png" alt="" aria-hidden="true" onerror="this.remove()">

<div class="page-main">
  <div class="g-stage" aria-hidden="true">
    <img   class="g-layer is-on" id="g-bg1" src="game1.webp" alt="">
    <video class="g-layer"       id="g-bg2" src="game2.mp4" muted playsinline preload="none"></video>
    <video class="g-layer"       id="g-bg3" src="game3.mp4" muted playsinline preload="none"></video>
    <video class="g-layer"       id="g-bg4" src="game4.mp4" muted playsinline preload="none"></video>
  </div>

  <button class="g-back" onclick="goBackPage()" aria-label="이전 화면으로 돌아가기">
    <i class="fi fi-rr-angle-left" aria-hidden="true"></i>
  </button>

  <div class="g-head" role="status" aria-live="polite">
    <h1 class="g-title" id="g-title">무엇이 잡힐까요?</h1>
    <p class="g-sub" id="g-sub">버튼을 눌러 낚시대를 던져보세요!</p>
  </div>

  <div class="g-spacer"></div>

  <div class="g-foot">
    <button class="g-cast" id="g-cast" onclick="onCast()" aria-label="낚시대 던지기">클릭</button>
  </div>

  <div class="g-result" id="g-result" hidden>
    <div class="g-result-nav">
      <button onclick="hideResult(); goBackPage()" aria-label="뒤로 가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12H4M11 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="g-result-logo" aria-hidden="true"></span>
      <span style="width:44px" aria-hidden="true"></span>
    </div>

    <div class="g-result-card" id="g-card" role="status" aria-live="polite">
      <div class="g-result-body">
        <div id="g-lose">
          <p class="g-result-kicker">아쉽네요</p>
          <h2 class="g-result-title">이번엔 꽝이에요.</h2>
          <p class="g-result-points">그래도 <b>5P</b>를 획득했어요!</p>
          <video class="g-result-art" src="0810(4).mp4"
                 preload="none" muted loop playsinline aria-hidden="true"
                 onerror="this.remove()"></video>
        </div>

        <div id="g-win" hidden>
          <h2 class="g-result-title">행운의 낚시 성공!<br>아메리카노 당첨!</h2>
          <p class="g-result-sub">쿠폰함에 쏙 넣어드렸어요</p>
          <div class="g-coupon-card">
            <div class="g-coupon-top">
              <span class="g-coupon-badge">N 지금배달 상품 쿠폰</span>
              <img class="g-coupon-product" src="game_img1.webp" alt="" aria-hidden="true" onerror="this.remove()">
            </div>
            <div class="g-coupon-bottom">
              <p class="g-coupon-name">스타벅스 아이스 아메리카노</p>
              <p class="g-coupon-expiry" id="g-coupon-expiry">발급일로부터 30일간 사용 가능</p>
            </div>
          </div>
        </div>
      </div>

      <div class="g-result-actions" id="g-result-actions">
        <button class="g-rbtn" id="g-rbtn-primary" onclick="onResultPrimary()">친구 초대하고 도전하기</button>
        <button class="g-rbtn g-rbtn--text" id="g-rbtn-secondary" onclick="onResultSecondary()">내 물고기 자랑하기 ›</button>
      </div>
    </div>
  </div>

  <div class="g-toast" id="g-toast" role="status" aria-live="polite"></div>
</div>

<img class="home-img" src="bottom.png" alt="" aria-hidden="true" onerror="this.remove()">

<script src="new_game.js"></script>
</body>
</html>
